[project]
name = "tls-termination-gateway-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "cryptography>=50.0.1",
    "fastapi[standard]>=0.141.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
